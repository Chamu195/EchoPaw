<!DOCTYPE html>
<html>
<head>
  <title>EchoPaw AI Face Guardian</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://teachablemachine.withgoogle.com/models/l--zhIVhQM/"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #F7F2FF;
      color: #2B124C;
      text-align: center;
      padding: 30px;
    }

    .card {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    h1 {
      color: #6A0DAD;
    }

    input, button {
      margin: 12px;
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #6A0DAD;
      color: white;
      cursor: pointer;
    }

    img {
      max-width: 350px;
      border-radius: 15px;
      margin-top: 15px;
    }

    #result {
      font-size: 26px;
      font-weight: bold;
      margin-top: 20px;
    }

    #confidence {
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>EchoPaw AI Face Guardian</h1>
    <p>Upload the ESP32-CAM photo to check whether the person is known or unknown.</p>

    <input type="file" id="imageUpload" accept="image/*">
    <br>

    <img id="preview" src="" alt="Uploaded image preview">
    
    <div id="result">AI Result: Waiting...</div>
    <div id="confidence"></div>
  </div>

  <script>
    // Paste your Teachable Machine model link here
    const URL = "https://teachablemachine.withgoogle.com/models/l--zhIVhQM/";

    let model;

    async function loadModel() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      document.getElementById("result").innerHTML = "AI Result: Model Loaded ✅";
    }

    loadModel();

    document.getElementById("imageUpload").addEventListener("change", async function(event) {
      const file = event.target.files[0];
      const image = document.getElementById("preview");

      image.src = window.URL.createObjectURL(file);

      image.onload = async function() {
        const prediction = await model.predict(image);

        let bestClass = prediction[0].className;
        let bestProbability = prediction[0].probability;

        for (let i = 1; i < prediction.length; i++) {
          if (prediction[i].probability > bestProbability) {
            bestClass = prediction[i].className;
            bestProbability = prediction[i].probability;
          }
        }

        let percent = (bestProbability * 100).toFixed(2);

        if (bestClass.toLowerCase() === "known") {
          document.getElementById("result").innerHTML = "✅ Known Person Detected";
        } else {
          document.getElementById("result").innerHTML = "🚨 Unknown Person Detected";
        }

        document.getElementById("confidence").innerHTML = "Confidence: " + percent + "%";
      };
    });
  </script>
</body>
</html>
